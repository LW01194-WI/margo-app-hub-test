  description: Hello World App with a compose file as package location
  version: "0.2-github"
  catalog:
    organization:
      - name: Weidmüller Development
        site: weidmueller.com
deploymentProfiles:
  - type: compose
    id: hello-world-app
    components:
      - name: hello-world-app
        properties:
          packageLocation: https://raw.githubusercontent.com/LW01194-WI/hello-world-FLECS-App/refs/heads/main/docker-compose.yml

